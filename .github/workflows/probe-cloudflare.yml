name: Verify MAMTU Cloudflare live release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify live search access and pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://mamtu.mohit-datascientist108.workers.dev'
          for attempt in $(seq 1 24); do
            robots="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/robots.txt" || true)"
            sitemap="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/sitemap.xml" || true)"
            html="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/" || true)"
            if [[ "$robots" == *'Allow: /'* ]] && [[ "$robots" == *"Sitemap: $base/sitemap.xml"* ]] && [[ "$sitemap" == *"<loc>$base/</loc>"* ]] && [[ "$html" == *'name="robots" content="index,follow"'* ]] && [[ "$html" == *"rel=\"canonical\" href=\"$base/\""* ]]; then
              for page in about gallery videos services reviews contact; do
                page_html="$(curl -fsSL --max-time 12 "$base/$page")"
                [[ "$page_html" == *'name="robots" content="index,follow"'* ]]
                [[ "$page_html" == *"rel=\"canonical\" href=\"$base/$page\""* ]]
                [[ "$sitemap" == *"<loc>$base/$page</loc>"* ]]
                echo "$page HTTP 200; indexable canonical in sitemap"
              done
              echo "LIVE_INDEXING_VERIFIED=$base/"
              exit 0
            fi
            echo "Waiting for Cloudflare search files (attempt $attempt)"
            sleep 12
          done
          echo "::error::Live search access did not match the repository"
          exit 1
