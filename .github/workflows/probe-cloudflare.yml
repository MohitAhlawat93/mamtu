name: Verify MAMTU Cloudflare live release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check production website and latest assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://mamtu.mohit-datascientist108.workers.dev'
          for attempt in $(seq 1 24); do
            html="$(curl -fsSL --connect-timeout 5 --max-time 14 "$base/" || true)"
            js="$(curl -fsSL --connect-timeout 5 --max-time 14 "$base/atelier.js" || true)"
            css="$(curl -fsSL --connect-timeout 5 --max-time 14 "$base/atelier.css" || true)"
            art="$(curl -fsSL --connect-timeout 5 --max-time 14 "$base/assets/images/art-study-06.svg" || true)"
            if [[ "$html" == *"Certain"* ]] && [[ "$html" == *"atelier.css"* ]] && [[ "$js" == *"initializeMedia"* ]] && [[ "$css" == *"cinema"* ]] && [[ "$art" == *"ARCHIVE / NOCTURNE"* ]]; then
              echo "LIVE_RELEASE_VERIFIED=$base/"
              echo "PASS: homepage, cinematic stylesheet, timed media code and latest original art"
              exit 0
            fi
            echo "Waiting for matching Cloudflare release (attempt $attempt / 24)"
            sleep 12
          done
          echo "::error::Cloudflare did not serve the final Mamtu build within the verification window"
          exit 1
