name: Verify MAMTU Cloudflare live release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify live site and real media
        shell: bash
        run: |
          set -euo pipefail
          base='https://mamtu.mohit-datascientist108.workers.dev'
          for attempt in $(seq 1 24); do
            html="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/" || true)"
            media="$(curl -fsSL --connect-timeout 5 --max-time 12 "$base/media.js" || true)"
            if [[ "$html" == *"Meet <em>Mamtu."* ]] && [[ "$html" == *'id="filmsGrid"'* ]] && [[ "$media" == *'/assets/images/6.jpeg'* ]] && [[ "$media" == *'/assets/images/3.jpeg'* ]] && [[ "$media" == *'/assets/videos/1.mp4'* ]]; then
              for asset in atelier.css atelier.js assets/images/6.jpeg assets/images/3.jpeg assets/videos/1.mp4 assets/videos/2.mp4 assets/videos/3.mp4; do
                code="$(curl -LsS -o /dev/null -w '%{http_code}' --max-time 15 "$base/$asset")"
                echo "$asset HTTP $code"
                if [[ "$code" != "200" ]]; then exit 1; fi
              done
              echo "LIVE_RELEASE_VERIFIED=$base/"
              exit 0
            fi
            echo "Waiting for Cloudflare to serve updated Mamtu assets (attempt $attempt)"
            sleep 12
          done
          echo "::error::Live release did not match expected Mamtu version"
          exit 1
