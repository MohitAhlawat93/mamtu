name: Identify Cloudflare live preview hostname
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe likely account-specific Worker domains
        shell: bash
        run: |
          set -u
          for subdomain in 'amohit920' 'mohitdatascientist1' 'mohit-datascientist1' 'mohitdatascientist' 'mohit-datascientist' 'mohitahlawat93' 'mohitahlawat' 'mohit-ahlawat93' 'mohit-ahlawat' 'mohitdatascientist123' 'mohit-datascientist-1' 'mohitdatascientist11' 'mohitdatascientist12' 'mohitdata' 'mohit' 'amohit920-4689'; do
            url="https://mamtu.$subdomain.workers.dev"
            file="$(mktemp)"
            code="$(curl -L -sS -o "$file" -w '%{http_code}' --connect-timeout 3 --max-time 8 "$url/" 2>/dev/null || true)"
            title="$(grep -oE '<title>[^<]*</title>' "$file" | head -1 || true)"
            echo "$url/ STATUS=$code TITLE=$title"
            if [ "$code" = "200" ] && grep -q 'MAMTU' "$file"; then
              echo "FOUND_LIVE_URL=$url/"
              for path in styles.css app.js assets/images/art-study-01.svg; do
                status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 "$url/$path" || true)"
                echo "LIVE_ASSET=$path STATUS=$status"
              done
              rm "$file"
              exit 0
            fi
            rm "$file"
          done
          echo "NO_MATCHING_HOST_FOUND"
