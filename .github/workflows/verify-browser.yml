name: Verify live MAMTU in Chromium
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "atelier.css"
      - "atelier.js"
      - "media.js"
      - "assets/**"
      - "tests/browser.cjs"
      - ".github/workflows/verify-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify public Cloudflare website on desktop and mobile
        run: node tests/browser.cjs
      - name: Preserve desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamtu-live-screenshots
          path: artifacts/
          if-no-files-found: ignore
